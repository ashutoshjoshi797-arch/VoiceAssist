name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Account, setup and privacy tests
        run: python -m unittest tests.test_accounts tests.test_setup -v

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: ver
        shell: bash
        run: echo "version=$(python -c 'import voiceassist; print(voiceassist.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow
          python packaging/make_icons.py
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Assemble payload (embedded Python x64 + ARM64, packages, speech models)
        shell: pwsh
        run: packaging/windows/build_payload.ps1
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=${{ steps.ver.outputs.version }}" packaging\windows\VoiceAssist.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAssist-Windows-Setup
          path: dist/VoiceAssist-Setup-*.exe
          if-no-files-found: error
      - name: Install silently (as a user would, no admin)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\VoiceAssist-Setup-*.exe)[0].FullName
          Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\VoiceAssist\python\pythonw.exe")) { throw "app not installed" }
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VoiceAssist.lnk"
      - name: End-to-end test of the installed app
        shell: pwsh
        run: '& "$env:LOCALAPPDATA\Programs\VoiceAssist\python\python.exe" packaging\windows\smoke_test.py'
      - name: Uninstall silently
        if: always()
        shell: pwsh
        run: |
          $u = "$env:LOCALAPPDATA\Programs\VoiceAssist\unins000.exe"
          if (Test-Path $u) { Start-Process $u -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait; Start-Sleep 3 }
          if (Test-Path "$env:LOCALAPPDATA\Programs\VoiceAssist\python") { throw "uninstall left files behind" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VoiceAssist.lnk") { throw "uninstall left the shortcut" }
          "uninstall OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-logs
          path: ~/AppData/Local/va-smoke.log
          if-no-files-found: ignore

  windows-arm64-test:
    needs: windows
    runs-on: windows-11-arm
    continue-on-error: true   # ARM64 runners may not be available to private repositories
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: VoiceAssist-Windows-Setup, path: dist }
      - name: Install silently on Windows ARM64
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\VoiceAssist-Setup-*.exe)[0].FullName
          Start-Process $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait
      - name: End-to-end test on ARM64
        shell: pwsh
        run: '& "$env:LOCALAPPDATA\Programs\VoiceAssist\python\python.exe" packaging\windows\smoke_test.py'

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the website edition (online only)
        run: python packaging/web/build_site.py site
      - name: Test it in Chrome (fake microphone, cloud APIs faked at the network layer)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import math, struct, wave
          # a short spoken-like test signal for the fake microphone (the transcription itself is faked)
          with wave.open("mic.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              frames = [0] * 32000 + [int(9000 * math.sin(i / 6) * (0.6 + 0.4 * math.sin(i / 900))) for i in range(40000)] + [0] * 48000
              w.writeframes(b"".join(struct.pack("<h", f) for f in frames))
          PY
          python tests/e2e_web.py --site site --wav mic.wav --chrome "$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  website-deploy:
    if: github.ref == 'refs/heads/main'
    needs: website
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - id: ver
        run: echo "version=$(python3 -c 'import voiceassist; print(voiceassist.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Android SDK packages (NDK for llama.cpp, CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Speech engine library (sherpa-onnx 1.13.8 AAR) and app icons
        run: |
          pip install pillow && python3 packaging/make_icons.py
          mkdir -p android/app/libs
          curl -fsSL -o android/app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
      - name: Core unit tests (JVM)
        run: gradle -p android -PcoreOnly :core:test --console=plain
      - name: Build the phone APK (arm64)
        run: |
          gradle -p android :app:assembleRelease -Pabis=arm64-v8a --console=plain
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/VoiceAssist-${{ steps.ver.outputs.version }}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAssist-Android-APK
          path: dist/VoiceAssist-*.apk
          if-no-files-found: error
      - name: Build the emulator test APK (x86_64, same code)
        run: gradle -p android :app:assembleDebug -Pabis=x86_64 --console=plain
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install, sign up, set up offline AI, talk to it - online and in AIRPLANE MODE
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 packaging/android/smoke_test.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-output
          path: android-test-output
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/VoiceAssist-Windows-Setup/*.exe
            out/VoiceAssist-Android-APK/*.apk
